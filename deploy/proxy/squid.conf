# Egress allowlist for the LLM container. Only HTTPS CONNECT to the listed hosts is allowed.
http_port 3128
acl llm_allowed dstdomain api.anthropic.com
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny !CONNECT
http_access deny !SSL_ports
http_access allow CONNECT llm_allowed
http_access deny all

cache deny all
access_log /var/log/squid/access.log
