# Majordome infrastructure stack (M0): Postgres, private Synapse homeserver, mautrix bridges.
#
# SECURITY: Docker-published ports bypass UFW. Every published port MUST bind to 127.0.0.1
# or to the Tailscale IP (${BIND_IP}) — never 0.0.0.0.

name: majordome

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      SYNAPSE_DB_PASSWORD: ${SYNAPSE_DB_PASSWORD:?}
      WHATSAPP_DB_PASSWORD: ${WHATSAPP_DB_PASSWORD:?}
      DISCORD_DB_PASSWORD: ${DISCORD_DB_PASSWORD:?}
      MAJORDOME_DB_PASSWORD: ${MAJORDOME_DB_PASSWORD:?}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    ports:
      - "${BIND_IP:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  synapse:
    image: matrixdotorg/synapse:${SYNAPSE_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ./data/synapse:/data
    ports:
      - "${BIND_IP:-127.0.0.1}:8008:8008"
    networks: [internal]

  mautrix-whatsapp:
    image: dock.mau.dev/mautrix/whatsapp:${WHATSAPP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ./data/whatsapp:/data
    networks: [internal]

  mautrix-discord:
    image: dock.mau.dev/mautrix/discord:${DISCORD_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ./data/discord:/data
    networks: [internal]

  # --- Majordome application ---
  majordome-migrate:
    <<: &majordome
      image: majordome:latest
      build: { context: "${MAJORDOME_SRC:-..}" }
      restart: unless-stopped
      depends_on:
        postgres: { condition: service_healthy }
      environment:
        MAJORDOME_DATABASE_URL: postgresql+asyncpg://majordome:${MAJORDOME_DB_PASSWORD}@postgres/majordome
        MAJORDOME_SESSION_SECRET: ${MAJORDOME_SESSION_SECRET:?}
        MAJORDOME_MATRIX_SERVER_NAME: ${SERVER_NAME}
        MAJORDOME_MATRIX_USER: ${MATRIX_USER}
      networks: [internal]
    restart: "no"
    command: ["alembic", "upgrade", "head"]

  majordome-api:
    <<: *majordome
    depends_on:
      majordome-migrate: { condition: service_completed_successfully }
    volumes:
      # Directories, not single files: the CLI replaces files atomically (new inode).
      - ./secrets/ui:/run/secrets/ui:ro
    ports:
      - "127.0.0.1:${MAJORDOME_PORT:-8787}:8080"
      - "${TAILSCALE_IP:?}:${MAJORDOME_PORT:-8787}:8080"

  majordome-worker:
    <<: *majordome
    depends_on:
      majordome-migrate: { condition: service_completed_successfully }
    command: ["python", "-m", "majordome.worker"]
    environment:
      MAJORDOME_DATABASE_URL: postgresql+asyncpg://majordome:${MAJORDOME_DB_PASSWORD}@postgres/majordome
      MAJORDOME_SESSION_SECRET: ${MAJORDOME_SESSION_SECRET:?}
      MAJORDOME_MATRIX_SERVER_NAME: ${SERVER_NAME}
      MAJORDOME_MATRIX_USER: ${MATRIX_USER}
      MAJORDOME_MATRIX_PASSWORD: ${MATRIX_PASSWORD:?}
    volumes:
      - ./secrets/email:/run/secrets/email:ro
      - ./data/majordome/oauth:/var/lib/majordome/oauth

  # Admin CLI: docker compose run --rm cli set-password | add-email | email-auth <address>
  cli:
    <<: *majordome
    restart: "no"
    profiles: [cli]
    depends_on: []
    entrypoint: ["majordome"]
    volumes:
      - ./secrets/ui:/run/secrets/ui
      - ./secrets/email:/run/secrets/email
      - ./data/majordome/oauth:/var/lib/majordome/oauth

  # --- LLM provider sandbox (claude_code provider; personal/dev use) ---
  llm-proxy:
    image: ubuntu/squid:latest
    restart: unless-stopped
    volumes:
      - ./proxy/squid.conf:/etc/squid/squid.conf:ro
    networks: [llm, egress]
    profiles: [llm]

  llm:
    build: ./llm
    restart: unless-stopped
    env_file: [./secrets/llm.env]   # CLAUDE_CODE_OAUTH_TOKEN=...
    read_only: true
    tmpfs:
      - /tmp
      - /home/node/.claude-isolated:uid=1000,gid=1000
      - /home/node/work:uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [llm]
    profiles: [llm]

networks:
  internal:
    name: majordome
  llm:
    name: majordome-llm
    internal: true        # no route to the internet; only llm-proxy is reachable
  egress:
    name: majordome-egress
