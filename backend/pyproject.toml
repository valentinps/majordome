[project]
name = "majordome"
version = "0.0.1"
description = "Self-hosted message butler: unified ingestion, policy engine and LLM triage."
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
